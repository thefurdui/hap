name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shell analysis tools
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash shellcheck
            echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: python3 scripts/release_checks.py --tag "$GITHUB_REF_NAME"
      - run: make check
